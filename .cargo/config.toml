# @formatter:off

[build]
incremental = false
jobs        = 8

#---------------------------------- Windows MSVC x86 (enable large address space, remove unreferenced code/data, identical code folding (merge duplicate code))
[target.i686-pc-windows-msvc]
#linker    = 'C:\Program Files\Microsoft Visual Studio\18\Community\VC\Tools\MSVC\14.51.36231\bin\Hostx64\x86\link.exe'
#ar        = 'C:\Program Files\Microsoft Visual Studio\18\Community\VC\Tools\MSVC\14.51.36231\bin\Hostx64\x86\lib.exe'
rustflags = ['-C', 'link-arg=/LARGEADDRESSAWARE',    # removes flag that limits 32-bit apps to use up to 2GB address space. 64-bit apps don't need this. designed when running them in 64-bit systems. note that it isn't magically makes them handle it well.
             '-C', 'link-arg=/OPT:REF',              # Linker optimization: removes all unreferenced functions, data sections, and code that isn't used by the program. Reduces final binary size without affecting functionality.
             '-C', 'link-arg=/OPT:ICF',              # Linker optimization: Identical Code Folding. Merges functions or code sections that are identical byte-for-byte, eliminating duplicate code. Shrinks binary size with no performance cost.
             '-C', 'link-arg=/DEBUG:NONE',           # Strips all debug symbols and debug information from the final executable. Significantly reduces file size; use only for production builds. Debugging symbols won't be available.
             '-C', 'link-arg=/ALIGN:4096',           # Aligns PE sections to 4096-byte boundaries. Can reduce binary size by eliminating padding between sections. Minor impact, safe to use.
             '-C', 'link-arg=/DYNAMICBASE',          # Enables Address Space Layout Randomization (ASLR). Modern security best practice; no performance penalty.
             '-C', 'link-arg=/NXCOMPAT',             # Enables Data Execution Prevention (DEP). Marks stack and heap as non-executable. Security hardening with minimal cost.
             '-C', 'link-arg=/LTCG',                 # Link-Time Code Generation. Enables aggressive cross-module optimizations. Works with lto=true in Cargo.toml .
             '-C', 'target-feature=+crt-static'      # Statically links the Microsoft Visual C Runtime (UCRT). The C runtime is embedded in your .exe instead of requiring msvcrt.dll at runtime. Creates a truly self-contained executable.
            ]

[target.x86_64-pc-windows-msvc]
#linker    = 'C:\Program Files\Microsoft Visual Studio\18\Community\VC\Tools\MSVC\14.51.36231\bin\Hostx64\x64\link.exe'
#ar        = 'C:\Program Files\Microsoft Visual Studio\18\Community\VC\Tools\MSVC\14.51.36231\bin\Hostx64\x64\lib.exe'
rustflags = ['-C', 'link-arg=/OPT:REF',              # Linker optimization: removes all unreferenced functions, data sections, and code that isn't used by the program. Reduces final binary size without affecting functionality.
             '-C', 'link-arg=/OPT:ICF',              # Linker optimization: Identical Code Folding. Merges functions or code sections that are identical byte-for-byte, eliminating duplicate code. Shrinks binary size with no performance cost.
             '-C', 'link-arg=/DEBUG:NONE',           # Strips all debug symbols and debug information from the final executable. Significantly reduces file size; use only for production builds. Debugging symbols won't be available.
             '-C', 'link-arg=/ALIGN:4096',           # Aligns PE sections to 4096-byte boundaries. Can reduce binary size by eliminating padding between sections. Minor impact, safe to use.
             '-C', 'link-arg=/DYNAMICBASE',          # Enables Address Space Layout Randomization (ASLR). Modern security best practice; no performance penalty.
             '-C', 'link-arg=/NXCOMPAT',             # Enables Data Execution Prevention (DEP). Marks stack and heap as non-executable. Security hardening with minimal cost.
             '-C', 'link-arg=/LTCG',                 # Link-Time Code Generation. Enables aggressive cross-module optimizations. Works with lto=true in Cargo.toml .
             '-C', 'target-feature=+crt-static'      # Statically links the Microsoft Visual C Runtime (UCRT). The C runtime is embedded in your .exe instead of requiring msvcrt.dll at runtime. Creates a truly self-contained executable.
            ]

[target.aarch64-pc-windows-msvc]
#linker    = 'C:\Program Files\Microsoft Visual Studio\18\Community\VC\Tools\MSVC\14.51.36231\bin\Hostx64\arm64\link.exe'
#ar        = 'C:\Program Files\Microsoft Visual Studio\18\Community\VC\Tools\MSVC\14.51.36231\bin\Hostx64\arm64\lib.exe'
