[package]
authors = ["Elad Karako <eladkarako@gmail.com>"]
categories = ["command-line-utilities"]
description = "HTTP proxy that tunnels through SOCKS5h"
documentation = "https://github.com/eladkarako/karako_http_socks5h_proxy#readme"
edition = "2024"
homepage = "https://github.com/eladkarako/karako_http_socks5h_proxy"
keywords = ["http-proxy", "socks5h", "tunnel", "cli"]
license = "MIT"
name = "karako_http_socks5h_proxy"
readme = "README.md"
repository = "https://github.com/eladkarako/karako_http_socks5h_proxy"
rust-version = "1.93.0"
version = "26.11.11"

[dependencies]
anyhow = { version = "1.0.104" }
base64 = { version = "0.22" }
bytes = { version = "1.12.1" }
clap = { version = "4.6.7", features = ["derive", "wrap_help", "usage", "cargo", "suggestions", "help", "color"] }
http = { version = "1.5.0" }
http-body-util = { version = "0.1.5" }
pin-project-lite = { version = "0.2" }
hyper = { version = "1.12.0", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "client-legacy"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
tokio-io-timeout = { version = "1.2" }
tower-service = { version = "0.3.3" }
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = { version = "2.0" }
tracing = { version = "0.1" }
tracing-appender = { version = "0.2" }
tracing-subscriber = { version = "0.3", features = ["fmt", "std"] }

#h2 = { version = "0.4.20", features = ["stream"] }
#hickory-resolver = { version = "0.26.3", features = ["tokio"] }
#http-body = { version = "1.1.0" }
#tower = { version = "0.5.3", features = ["util", "tokio", "tokio-stream", "tokio-util"] }
#tower-service = { version = "0.3.3" }

[target.'cfg(all(any(target_os="linux",target_os="windows"),any(target_arch="x86_64",target_arch="x86",target_arch="aarch64")))'.dependencies]
mimalloc = { version = "0.1.52" }

[target.x86_64-pc-windows-msvc.build-dependencies]
toml = "1.2.1"
winres = "0.1.12"

[target.i686-pc-windows-msvc.build-dependencies]
toml = "1.2.1"
winres = "0.1.12"

[target.aarch64-pc-windows-msvc.build-dependencies]
toml = "1.2.1"
winres = "0.1.12"


[profile.release]
codegen-units = 1                                                   # Single unit for better LTO optimization and smaller binary size.
debug = false                                                       # Removes debug symbols for smaller binary.
incremental = false                                                 # Disable incremental compilation for cleaner builds, prevents stale build artifacts in release mode.
lto = true                                                          # Link-time optimization across compilation units, for better performances.
opt-level = 3                                                       # prioritizes speed (loop unrolling, better branch prediction, instruction cache fit) over binary size. use value "z" (instead of 3) for optimizing size.
panic = "unwind"                                                    # Keep unwinding so a panic in one connection task is contained and reported instead of taking down the whole proxy.
rpath = false                                                       # Do not embed runtime library search paths which prevents runtime path issues, needed for static builds.
strip = true                                                        # Removes all symbols from final binary minimizes its size.

[profile.release-size]
inherits = "release"
opt-level = "z"                                                     # Optimize for binary size instead of speed; opt into it with `cargo build --profile release-size`.
