[package]
authors = ["Elad Karako <eladkarako@gmail.com>"]
categories = ["command-line-utilities"]
description = "HTTP proxy that tunnels through SOCKS5h"
documentation = "https://github.com/eladkarako/karako_http_socks5h_proxy#readme"
edition = "2024"
homepage = "https://github.com/eladkarako/karako_http_socks5h_proxy"
keywords = ["http-proxy", "socks5h", "tunnel", "cli"]
license = "MIT"
name = "karako_http_socks5h_proxy"
readme = "README.md"
repository = "https://github.com/eladkarako/karako_http_socks5h_proxy"
rust-version = "1.93.0"
version = "26.10.27"

[dependencies]
anyhow = { version = "1.0.104" }
bytes = { version = "1.12.1", features = ["extra-platforms"] }
clap = { version = "4.6.7", features = ["derive", "wrap_help", "usage", "cargo", "suggestions", "help", "color"] }
http = { version = "1.5.0" }
http-body-util = { version = "0.1.5" }
hyper = { version = "1.12.0", features = ["full", "http2", "http1", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tokio = { version = "1.54.1", features = ["full"] }
socket2 = { version = "0.6.5", features = ["all"] }

#h2 = { version = "0.4.20", features = ["stream"] }
#hickory-resolver = { version = "0.26.3", features = ["tokio"] }
#http-body = { version = "1.1.0" }
#tower = { version = "0.5.3", features = ["util", "tokio", "tokio-stream", "tokio-util"] }
#tower-service = { version = "0.3.3" }

[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "x86", target_arch = "aarch64")))'.dependencies]
mimalloc = { version = "0.1.52" }

[target.x86_64-pc-windows-msvc.build-dependencies]
toml = "1.1.8"
winres = "0.1.12"

[target.i686-pc-windows-msvc.build-dependencies]
toml = "1.1.8"
winres = "0.1.12"

[target.aarch64-pc-windows-msvc.build-dependencies]
toml = "1.1.8"
winres = "0.1.12"


[profile.release]
codegen-units = 1                                                   # Single unit for better optimization and smaller binary size
debug = false                                                       # Strip debug symbols for smaller binary
incremental = false                                                 # Disable incremental compilation for cleaner builds
lto = true                                                          # Link-time optimization for better performance
opt-level = 2                                                       # prioritizes speed (loop unrolling, better branch prediction, instruction cache fit) over binary size.
panic = "abort"                                                     # Replace unwinding with abort (smaller binary, faster panics)
rpath = false                                                       # Don't embed runtime library search paths
strip = true                                                        # Strip all symbols from final binary
