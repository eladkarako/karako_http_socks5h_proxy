[package]
authors = ["Elad Karako <eladkarako@gmail.com>"]
categories = ["command-line-utilities", "network-programming"]
description = "HTTP-SOCKS5H proxy with DNS resolution on remote"
documentation = "https://github.com/eladkarako/karako_http_socks5h_proxy#readme"
edition = "2024"
homepage = "https://github.com/eladkarako/karako_http_socks5h_proxy"
keywords = ["cli", "forward-proxy", "http", "proxy", "socks5h"]
license = "MIT"
name = "karako_http_socks5h_proxy"
readme = "README.md"
repository = "https://github.com/eladkarako/karako_http_socks5h_proxy"
rust-version = "1.93.0"
version = "26.10.1"


[dependencies]
bytes = "1.12.1"                                           # Efficient byte buffer management
clap = { version = "4.6.7", features = ["derive"] }        # CLI argument parsing with derive macros
env_logger = "0.11.11"                                     # Logging implementation (outputs to stderr/stdout)
futures = "0.3.34"                                         # Async utilities (join_all for concurrent task handling)
http = "1.5.0"                                             # HTTP types (status codes, headers, methods, versions)
http-body-util = "0.1.5"                                   # Body utilities (BodyExt trait, collect, to_bytes)
hyper = { version = "1.11.1", features = ["full"] }        # HTTP/1.1 server and client implementation
hyper-util = { version = "0.1.21", features = ["tokio"] }  # Connection builders and executors for hyper
log = "0.4.34"                                             # Logging facade (structured logging interface)
tokio = { version = "1.53.1", features = ["full"] }        # Async runtime for networking, timers, task spawning
tokio-socks = "0.5.3"                                      # SOCKS5 protocol client for tunneling connections


[build-dependencies]
toml = "1.1.6"                                             # TOML parsing for build scripts
winres = "0.1.12"                                          # Windows resource file handling (exe metadata, icons, version info)


[profile.release]
codegen-units = 1                                          # Single unit for better optimization and binary size
debug = false                                              # Strip debug symbols for smaller binary
incremental = false                                        # Disable incremental compilation for cleaner builds
lto = true                                                 # Link-time optimization for better performance
opt-level = "z"                                            # Maximum optimization for binary size
panic = "abort"                                            # Replace unwinding with abort (smaller binary, faster panics)
rpath = false                                              # Don't embed runtime library search paths
strip = true                                               # Strip all symbols from final binary

